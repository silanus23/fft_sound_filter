name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: arm-none-eabi build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Build
        run: make all

      - name: Report size
        run: arm-none-eabi-size build/fft_sound_filter.elf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fft_sound_filter
          path: |
            build/fft_sound_filter.elf
            build/fft_sound_filter.hex
            build/fft_sound_filter.bin
